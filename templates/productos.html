<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda</title>
    <style>
        body {
            margin: 0;
            padding: 10px 10px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            height: 100vh;
            display: flex;
            box-sizing: border-box;
            overflow: hidden;
        }

        .main-container {
            width: 100%;
            height: 100%;
            background-color: #fff;
            display: flex;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background-color: #333;
            color: #fff;
            padding: 20px;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            margin-bottom: 15px;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        /* Contenido principal */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
        }

        .navbar .logo {
            font-weight: bold;
        }

        .navbar .search input {
            width: 300px;
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
        }

        .navbar .user {
            font-weight: bold;
        }

        /* Grid de productos */
        .products {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            overflow-y: auto;
            flex: 1;
            align-items: start;
        }

        .product {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            height: auto;
            display: flex;
            flex-direction: column;
        }

        .product img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 10px;
            min-height: 150px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <h3>Menú</h3>
            <a href="#">Inicio</a>
            <a href="#">Categorías</a>
            <a href="#">Ofertas</a>
            <a href="/registro-proveedor">Añadir Proveedor</a>
            <a href="/registro-producto">Añadir Producto</a>
        </div>
        <div class="content">
            <div class="navbar">
                <div class="logo">MiLogo</div>
                <div class="search">
                    <input type="text" placeholder="Buscar productos...">
                </div>
                <div class="user">Usuario</div>
            </div>
            <div class="products">
                <!-- Productos de ejemplo -->
                <div class="product"><img src="https://via.placeholder.com/150" alt="Producto 1"><p>Producto 1</p></div>
                <div class="product"><img src="https://via.placeholder.com/150" alt="Producto 2"><p>Producto 2</p></div>
                <div class="product"><img src="https://via.placeholder.com/150" alt="Producto 3"><p>Producto 3</p></div>
                <div class="product"><img src="https://via.placeholder.com/150" alt="Producto 4"><p>Producto 4</p></div>
                <div class="product"><img src="https://via.placeholder.com/150" alt="Producto 5"><p>Producto 5</p></div>
            </div>
        </div>
    </div>
</body>
</html>
