<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InsideBox</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .brand {
            font-weight: 700;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .brand img {
            width: 28px;
        }

        .input-label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .submit-btn {
            width: 100%;
            background: #2d6cdf;
            border: none;
            padding: 10px;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 15px;
        }

        .submit-btn:hover {
            background: #1f54b8;
        }

        a {
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .bottom-text {
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- Logo + Brand -->
        <div class="brand">
            <img src="https://img.icons8.com/ios-filled/50/000000/processor.png" alt="Logo">
            Circuit Box
        </div>

        <p class="text-muted">Please enter your details</p>
        <h3 class="mb-4">Welcome back</h3>

        <!-- Login Form -->
        <form action="/login" method="POST">

            <label class="input-label">Email address</label>
            <input type="email" name="email" class="form-control mb-3" required>

            <label class="input-label">Password</label>
            <input type="password" name="password" class="form-control mb-3" required>

            <div class="d-flex justify-content-end mb-3">
                <a href="#">Forgot password</a>
            </div>

            <button type="submit" class="submit-btn">Sign in</button>

        </form>

        <p class="bottom-text">
            Don't have an account? <a href="/signup">Sign up</a>
        </p>

    </div>

</body>
</html>
