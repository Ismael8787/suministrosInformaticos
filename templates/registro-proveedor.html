<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Proveedor - Circuit Box</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            width: 600px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .brand {
            font-weight: 700;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .brand img {
            width: 28px;
        }

        .input-label {
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            background: #2d6cdf;
            border: none;
            padding: 10px;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 15px;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #1f54b8;
        }

        .bottom-text {
            margin-top: 15px;
            text-align: center;
        }

        .bottom-text a {
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="brand">
            <img src="https://img.icons8.com/ios-filled/50/000000/truck.png" alt="Logo">
            Circuit Box
        </div>

        <h3 class="mb-4">Registrar Nuevo Proveedor</h3>

        <form action="/create-proveedor" method="POST">
            <div class="row">
                <div class="col-12">
                    <label class="input-label">Nombre del Proveedor</label>
                    <input type="text" name="nombre" class="form-control mb-3" placeholder="Nombre o Razón Social" required>
                </div>

                <div class="col-6">
                    <label class="input-label">CIF / NIF</label>
                    <input type="text" name="cif" class="form-control mb-3" placeholder="A12345678" required>
                </div>
                <div class="col-6">
                    <label class="input-label">Teléfono</label>
                    <input type="tel" name="telefono" class="form-control mb-3" placeholder="Ej: 600000000">
                </div>

                <div class="col-12">
                    <label class="input-label">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control mb-3" placeholder="correo@proveedor.com" required>
                </div>

                <div class="col-12">
                    <label class="input-label">Dirección</label>
                    <input type="text" name="direccion" class="form-control mb-3" placeholder="Dirección completa">
                </div>

                <div class="col-6">
                    <label class="input-label">IVA (%)</label>
                    <div class="input-group mb-3">
                        <input type="number" step="0.01" name="iva" class="form-control" value="21">
                        <span class="input-group-text">%</span>
                    </div>
                </div>
                <div class="col-6">
                    <label class="input-label">Descuento (%)</label>
                    <div class="input-group mb-3">
                        <input type="number" step="0.01" name="descuento" class="form-control" placeholder="0.00">
                        <span class="input-group-text">%</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn">Guardar Proveedor</button>
            <div class="bottom-text">
                <a href="/productos" class="text-muted">Cancelar y volver</a>
            </div>
        </form>

    </div>

</body>
</html>
